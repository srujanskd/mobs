name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: python3 -m unittest discover -s tests/performance -v
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease :app:assembleBenchmark :benchmarks:assembleBenchmark lintDebug lintRelease
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: mobs-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: device-correctness-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
